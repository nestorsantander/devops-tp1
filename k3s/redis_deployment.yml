apiVersion: apps/v1
kind: Deployment
metadata:
  name: contredis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: contredis
        image: redis/redis-stack:latest
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: contredis
spec:
  type: NodePort
  ports:
  - port: 6379
    targetPort: 6379
    nodePort: 30007  # Puerto en el nodo host, puedes cambiarlo si es necesario
  selector:
    app: redis
